<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Valoxi Post Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --btn-bg: var(--tg-theme-button-color, #38bdf8);
      --btn-text: var(--tg-theme-button-text-color, #0f172a);
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 90px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--hint);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--hint);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input, textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--btn-bg);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .toggles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .toggle-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .toggle-card.active {
      border-color: var(--btn-bg);
      background: rgba(56, 189, 248, 0.1);
    }

    .toggle-title {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 4px;
    }

    .toggle-val {
      font-size: 14px;
      font-weight: bold;
    }

    /* Live Preview Section */
    .preview-section {
      background: #17212b;
      border-radius: 12px;
      padding: 12px;
      border: 1px dashed var(--border);
      margin-bottom: 20px;
    }

    .preview-badge {
      font-size: 11px;
      color: var(--hint);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .preview-body {
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 12px;
    }

    .preview-btn {
      display: block;
      width: 100%;
      background: rgba(43, 82, 120, 0.7);
      color: #6ab2f2;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(106, 178, 242, 0.2);
    }

    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .btn-main {
      flex: 1;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">⚡ Valoxi Studio</div>
    <div class="user-pill" id="user-display">Loading...</div>
  </div>

  <!-- Form Section -->
  <div class="card">
    <div class="form-group">
      <label>Target Channel</label>
      <input type="text" id="target-chat" placeholder="@YourChannel or @Group" />
    </div>

    <div class="form-group">
      <label>Post Content / Caption</label>
      <textarea id="post-content" placeholder="Type announcement or text here..."></textarea>
    </div>

    <div class="form-group">
      <label>Photo URL (Optional)</label>
      <input type="url" id="photo-url" placeholder="https://cdn.site.com/image.webp" />
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Button Label (Custom Name)</label>
      <input type="text" id="btn-text" placeholder="e.g. Claim Airdrop 🚀" maxlength="32" />
    </div>

    <div class="form-group">
      <label>Destination Link (URL)</label>
      <input type="url" id="btn-url" placeholder="https://t.me/yourlink" />
    </div>
  </div>

  <!-- Quick Options -->
  <div class="toggles">
    <div class="toggle-card" id="pin-card" onclick="togglePin()">
      <div class="toggle-title">Auto-Pin Post</div>
      <div class="toggle-val" id="pin-status">OFF ❌</div>
    </div>
    <div class="toggle-card" id="del-card" onclick="toggleDelete()">
      <div class="toggle-title">Auto-Delete Ad</div>
      <div class="toggle-val" id="del-status">Never ⏱️</div>
    </div>
  </div>

  <!-- Live Client-side Telegram Preview -->
  <div class="preview-badge">Live Telegram Preview</div>
  <div class="preview-section">
    <div class="preview-body" id="preview-text">Your post text will appear here...</div>
    <a href="#" class="preview-btn" id="preview-button">Button Name</a>
  </div>

  <!-- Fixed Action Footer -->
  <div class="footer-bar">
    <button class="btn-main" id="dispatch-btn" onclick="publishPost()">🚀 Post to Channel</button>
  </div>

  <script>
    const BACKEND_URL = "https://tight-violet-00f8.solofate-core.workers.dev";
    const tg = window.Telegram?.WebApp;

    let autoPin = false;
    const deleteOptions = [0, 1, 6, 24];
    let deleteIdx = 0;

    // 1. Initialize Telegram WebApp
    if (tg) {
      tg.ready();
      tg.expand();
      
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('user-display').innerText = `@${user.username || user.first_name}`;
        // Auth & Save User silently on login
        syncUser(tg.initData);
      } else {
        document.getElementById('user-display').innerText = "Web Preview";
      }
    }

    // 2. Realtime Preview Listener
    const postContent = document.getElementById('post-content');
    const btnText = document.getElementById('btn-text');
    const previewText = document.getElementById('preview-text');
    const previewBtn = document.getElementById('preview-button');

    postContent.addEventListener('input', () => {
      previewText.innerText = postContent.value.trim() || 'Your post text will appear here...';
    });

    btnText.addEventListener('input', () => {
      previewBtn.innerText = btnText.value.trim() || 'Button Name';
    });

    // 3. Toggles
    function togglePin() {
      autoPin = !autoPin;
      document.getElementById('pin-status').innerText = autoPin ? 'ON ✅' : 'OFF ❌';
      document.getElementById('pin-card').classList.toggle('active', autoPin);
      tg?.HapticFeedback?.selectionChanged();
    }

    function toggleDelete() {
      deleteIdx = (deleteIdx + 1) % deleteOptions.length;
      const hrs = deleteOptions[deleteIdx];
      document.getElementById('del-status').innerText = hrs === 0 ? 'Never ⏱️' : `${hrs} Hours ⏱️`;
      document.getElementById('del-card').classList.toggle('active', hrs > 0);
      tg?.HapticFeedback?.selectionChanged();
    }

    // 4. Background Silent User Sync
    async function syncUser(initData) {
      if (!initData) return;
      try {
        await fetch(`${BACKEND_URL}/api/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData })
        });
      } catch (_) {}
    }

    // 5. Publish Post
    async function publishPost() {
      const target = document.getElementById('target-chat').value.trim();
      const text = postContent.value.trim();
      const photo = document.getElementById('photo-url').value.trim();
      const buttonLabel = btnText.value.trim();
      const buttonUrl = document.getElementById('btn-url').value.trim();

      if (!target || !target.startsWith('@')) {
        alert("Please enter a valid channel username starting with @ (e.g. @MyChannel)");
        return;
      }

      if (!text && !photo) {
        alert("Please write some post text or enter a photo URL.");
        return;
      }

      if (!buttonLabel || !buttonUrl) {
        alert("Please fill in both Button Name and Destination URL.");
        return;
      }

      const btn = document.getElementById('dispatch-btn');
      btn.disabled = true;
      btn.innerText = "Dispatching...";
      tg?.MainButton?.showProgress?.();

      try {
        const payload = {
          initData: tg?.initData || '',
          target,
          text,
          photo: photo || null,
          buttons: [[{ text: buttonLabel, url: buttonUrl }]],
          autoPin,
          autoDeleteHours: deleteOptions[deleteIdx]
        };

        const res = await fetch(`${BACKEND_URL}/api/publish`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.ok) {
          tg?.HapticFeedback?.notificationOccurred('success');
          alert(`🎉 Post dispatched successfully to ${target}!`);
          tg?.close();
        } else {
          tg?.HapticFeedback?.notificationOccurred('error');
          alert(`❌ Failed: ${data.error || 'Check bot admin permissions.'}`);
        }
      } catch (err) {
        alert("Network error. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 Post to Channel";
      }
    }
  </script>
</body>
</html>
