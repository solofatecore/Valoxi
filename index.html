<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Valoxi Post Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0b1120);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #0f172a);
      --border: #334155;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 90px;
    }

    .user-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--border);
      object-fit: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--hint);
    }
    .user-meta .name {
      font-size: 14px;
      font-weight: 700;
    }
    .user-meta .tier {
      font-size: 11px;
      color: #38bdf8;
      text-transform: uppercase;
      font-weight: 600;
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .form-group { margin-bottom: 12px; }
    .form-group:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input, textarea, select {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .file-upload-box {
      border: 2px dashed var(--border);
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      color: var(--hint);
      background: rgba(0,0,0,0.15);
    }
    .file-upload-box.selected {
      border-color: var(--accent);
      color: var(--accent);
    }

    .preview-box {
      background: #17212b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
    }
    .preview-header {
      font-size: 11px;
      color: var(--hint);
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .preview-text {
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
    }
    .preview-btn {
      display: block;
      background: rgba(43, 82, 120, 0.75);
      color: #6ab2f2;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .chan-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .chan-del {
      color: var(--danger);
      background: none;
      border: none;
      font-weight: bold;
      cursor: pointer;
      padding: 4px 8px;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0f172a;
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 99;
    }
    .nav-item {
      flex: 1;
      padding: 14px 0;
      text-align: center;
      color: var(--hint);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .nav-item.active {
      color: var(--accent);
      border-top: 2px solid var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .btn-action {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="user-header">
    <div class="user-info">
      <div id="user-avatar" class="avatar">U</div>
      <div class="user-meta">
        <div class="name" id="user-name">Loading User...</div>
        <div class="tier">Free Tier (2 Channels Max)</div>
      </div>
    </div>
  </div>

  <!-- VIEW 1: STUDIO -->
  <div id="view-studio" class="view active">
    <div class="card">
      <div class="form-group">
        <label>Select Target Channel</label>
        <select id="channel-selector">
          <option value="">-- Choose Channel or Type Below --</option>
        </select>
        <input type="text" id="target-chat-manual" placeholder="Or enter @ChannelUsername" style="margin-top: 8px;" />
      </div>

      <div class="form-group">
        <label>Post Text / Caption</label>
        <textarea id="post-text" placeholder="Type message or caption..."></textarea>
      </div>

      <div class="form-group">
        <label>Attach Photo / PDF</label>
        <div class="file-upload-box" id="file-drop-zone" onclick="document.getElementById('post-file').click()">
          📁 Tap to attach Image or PDF
        </div>
        <input type="file" id="post-file" accept="image/*,application/pdf" style="display: none;" onchange="handleFileSelect(event)" />
      </div>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Custom Button Name</label>
        <input type="text" id="btn-label" placeholder="e.g. Join Channel 🚀" maxlength="30" />
      </div>

      <div class="form-group">
        <label>Button Destination URL</label>
        <input type="url" id="btn-url" placeholder="https://t.me/yourlink" />
      </div>
    </div>

    <div class="preview-header">Live Post Preview</div>
    <div class="preview-box">
      <div class="preview-text" id="preview-text">Your post text will appear here...</div>
      <a href="#" class="preview-btn" id="preview-btn">Button Name</a>
    </div>

    <button class="btn-action" id="publish-btn" onclick="publishPost()">🚀 Dispatch to Channel</button>
  </div>

  <!-- VIEW 2: CHANNELS -->
  <div id="view-channels" class="view">
    <div class="card">
      <label>Add Channel (Free Limit: 2 Max)</label>
      <input type="text" id="new-channel-input" placeholder="@YourChannel" />
      <button class="btn-action" style="margin-top: 10px;" onclick="addChannel()">➕ Save Channel</button>
    </div>

    <div class="preview-header">Your Linked Channels (<span id="chan-count">0</span>/2)</div>
    <div id="channels-list"></div>
  </div>

  <div class="nav-bar">
    <div class="nav-item active" id="tab-studio" onclick="switchTab('studio')">⚡ Studio</div>
    <div class="nav-item" id="tab-channels" onclick="switchTab('channels')">📢 Channels (<span id="tab-chan-count">0</span>/2)</div>
  </div>

  <script>
    const BACKEND = "https://tight-violet-00f8.solofate-core.workers.dev";
    const tg = window.Telegram?.WebApp;
    let selectedFile = null;

    if (tg) {
      tg.ready();
      tg.expand();

      const u = tg.initDataUnsafe?.user;
      if (u) {
        document.getElementById('user-name').innerText = `${u.first_name || ''} ${u.last_name || ''}`.trim() || `@${u.username}`;
        if (u.photo_url) {
          document.getElementById('user-avatar').innerHTML = `<img src="${u.photo_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else {
          document.getElementById('user-avatar').innerText = (u.first_name || 'U')[0].toUpperCase();
        }
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      if (tab === 'studio') {
        document.getElementById('view-studio').classList.add('active');
        document.getElementById('tab-studio').classList.add('active');
      } else {
        document.getElementById('view-channels').classList.add('active');
        document.getElementById('tab-channels').classList.add('active');
        loadChannels();
      }
    }

    const pText = document.getElementById('post-text');
    const bLabel = document.getElementById('btn-label');
    pText.addEventListener('input', () => {
      document.getElementById('preview-text').innerText = pText.value.trim() || 'Your post text will appear here...';
    });
    bLabel.addEventListener('input', () => {
      document.getElementById('preview-btn').innerText = bLabel.value.trim() || 'Button Name';
    });

    // Auto-compress high-res images to 300KB-500KB (Zero quality loss on mobile)
    async function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1600;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              if (blob) {
                const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, ".jpg"), {
                  type: 'image/jpeg',
                  lastModified: Date.now()
                });
                resolve(compressedFile);
              } else {
                resolve(file);
              }
            }, 'image/jpeg', 0.85);
          };
        };
      });
    }

    async function handleFileSelect(e) {
      const file = e.target.files[0];
      const zone = document.getElementById('file-drop-zone');
      if (!file) {
        selectedFile = null;
        zone.classList.remove('selected');
        zone.innerText = '📁 Tap to attach Image or PDF';
        return;
      }

      if (file.type.startsWith('image/')) {
        zone.innerText = '⚡ Optimizing image...';
        selectedFile = await compressImage(file);
        zone.classList.add('selected');
        zone.innerText = `✅ Ready: ${(selectedFile.size / 1024).toFixed(0)} KB (Optimized)`;
      } else {
        selectedFile = file;
        zone.classList.add('selected');
        zone.innerText = `📄 Document: ${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
      }
    }

    async function loadChannels() {
      try {
        const res = await fetch(`${BACKEND}/api/channels`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg?.initData || '' })
        });
        const data = await res.json();
        if (data.ok) renderChannels(data.channels || []);
      } catch (_) {}
    }

    function renderChannels(list) {
      const selector = document.getElementById('channel-selector');
      const listContainer = document.getElementById('channels-list');
      document.getElementById('chan-count').innerText = list.length;
      document.getElementById('tab-chan-count').innerText = list.length;

      selector.innerHTML = '<option value="">-- Choose Linked Channel --</option>';
      listContainer.innerHTML = '';

      list.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch.channel_username;
        opt.innerText = ch.channel_username;
        selector.appendChild(opt);

        const item = document.createElement('div');
        item.className = 'chan-item';
        item.innerHTML = `
          <span><b>📢 ${ch.channel_username}</b></span>
          <button class="chan-del" onclick="deleteChannel('${ch.channel_username}')">✕ Remove</button>
        `;
        listContainer.appendChild(item);
      });
    }

    async function addChannel() {
      const input = document.getElementById('new-channel-input');
      const val = input.value.trim();
      if (!val.startsWith('@')) {
        alert("Channel username must start with @ (e.g. @MyChannel)");
        return;
      }

      try {
        const res = await fetch(`${BACKEND}/api/channel/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg?.initData || '', channel: val })
        });
        const data = await res.json();
        if (data.ok) {
          input.value = '';
          alert("Channel linked successfully!");
          loadChannels();
        } else {
          alert(`❌ ${data.error}`);
        }
      } catch (_) {
        alert("Network error.");
      }
    }

    async function deleteChannel(username) {
      if (!confirm(`Remove ${username}?`)) return;
      try {
        await fetch(`${BACKEND}/api/channel/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg?.initData || '', channel: username })
        });
        loadChannels();
      } catch (_) {}
    }

    async function publishPost() {
      const selChan = document.getElementById('channel-selector').value;
      const manualChan = document.getElementById('target-chat-manual').value.trim();
      const target = selChan || manualChan;
      const text = pText.value.trim();
      const btnName = bLabel.value.trim();
      const btnLink = document.getElementById('btn-url').value.trim();

      if (!target || !target.startsWith('@')) {
        alert("Please pick or enter a valid channel username starting with @");
        return;
      }
      if (!text && !selectedFile) {
        alert("Please provide post text or attach an Image/PDF.");
        return;
      }
      if (!btnName || !btnLink) {
        alert("Please enter both Button Name and Link.");
        return;
      }

      const btn = document.getElementById('publish-btn');
      btn.disabled = true;
      btn.innerText = "Dispatching...";

      const formData = new FormData();
      formData.append('initData', tg?.initData || '');
      formData.append('target', target);
      formData.append('text', text);
      formData.append('buttonLabel', btnName);
      formData.append('buttonUrl', btnLink);
      if (selectedFile) {
        formData.append('file', selectedFile);
      }

      try {
        const res = await fetch(`${BACKEND}/api/publish`, {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.ok) {
          tg?.HapticFeedback?.notificationOccurred('success');
          alert(`🎉 Post successfully delivered to ${target}!`);
          pText.value = '';
          bLabel.value = '';
          document.getElementById('post-file').value = '';
          selectedFile = null;
          handleFileSelect({ target: { files: [] } });
        } else {
          tg?.HapticFeedback?.notificationOccurred('error');
          alert(`❌ ${data.error || 'Failed to dispatch post'}`);
        }
      } catch (err) {
        alert("Network error. Please try again.");
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 Dispatch to Channel";
      }
    }

    loadChannels();
  </script>
</body>
</html>
